name: Build Android APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
      - name: Create Android project
        run: |
          flutter create --platforms=android --org com.wirdi --project-name wirdi app
          rm -rf app/test
          cp main.dart app/lib/main.dart
          mkdir -p app/assets
          cp app.html app/assets/app.html
          cat > app/pubspec.yaml <<'EOF'
          name: wirdi
          description: وردي اليومي
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.5.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            shared_preferences: ^2.3.2
            flutter_local_notifications: ^17.2.3
            timezone: ^0.9.4
            adhan: 2.0.0+1
            geolocator: ^13.0.1
            webview_flutter: ^4.9.0
          flutter:
            uses-material-design: true
            assets:
              - assets/app.html
          EOF
      - name: Patch Android config
        run: |
          python3 - <<'PY'
          import os, re
          root = 'app/android/app'
          mp = os.path.join(root, 'src/main/AndroidManifest.xml')
          s = open(mp, encoding='utf-8').read()
          perms = ''.join('    <uses-permission android:name="android.permission.%s"%s/>\n' % (n, extra) for n, extra in [
              ('INTERNET', ''), ('POST_NOTIFICATIONS', ''), ('RECEIVE_BOOT_COMPLETED', ''), ('VIBRATE', ''),
              ('ACCESS_COARSE_LOCATION', ''), ('ACCESS_FINE_LOCATION', ''),
              ('SCHEDULE_EXACT_ALARM', ' android:maxSdkVersion="32"'), ('USE_EXACT_ALARM', '')])
          recv = ('        <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver"/>\n'
                  '        <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">\n'
                  '            <intent-filter>\n'
                  '                <action android:name="android.intent.action.BOOT_COMPLETED"/>\n'
                  '                <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>\n'
                  '                <action android:name="android.intent.action.QUICKBOOT_POWERON"/>\n'
                  '                <action android:name="com.htc.intent.action.QUICKBOOT_POWERON"/>\n'
                  '            </intent-filter>\n'
                  '        </receiver>\n')
          s = s.replace('<application', perms + '    <application', 1)
          s = s.replace('</application>', recv + '    </application>', 1)
          s = re.sub(r'android:label="[^"]*"', 'android:label="وردي"', s, count=1)
          open(mp, 'w', encoding='utf-8').write(s)
          for name in ['build.gradle', 'build.gradle.kts']:
              p = os.path.join(root, name)
              if not os.path.exists(p):
                  continue
              g = open(p, encoding='utf-8').read()
              kts = name.endswith('.kts')
              flag = 'isCoreLibraryDesugaringEnabled = true' if kts else 'coreLibraryDesugaringEnabled true'
              g = re.sub(r'(compileOptions\s*\{)', lambda m: m.group(1) + '\n        ' + flag, g, count=1)
              g = re.sub(r'minSdkVersion\s+flutter\.minSdkVersion', 'minSdkVersion 24', g)
              g = re.sub(r'minSdk\s*=\s*flutter\.minSdkVersion', 'minSdk = 24', g)
              if kts:
                  g += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")\n}\n'
              else:
                  g += "\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'\n}\n"
              open(p, 'w', encoding='utf-8').write(g)
              print('patched', p)
          PY
      - name: Prepare sound files
        run: |
          python3 - <<'PY'
          import os, shutil, math, struct, wave
          raw = 'app/android/app/src/main/res/raw'
          os.makedirs(raw, exist_ok=True)
          SR = 22050
          def tone(f, d, vol=0.5):
              out = []
              n = int(SR * d)
              for i in range(n):
                  t = i / SR
                  env = math.exp(-3 * t / d) * min(1.0, t * 40)
                  out.append(vol * env * (math.sin(2 * math.pi * f * t) + 0.3 * math.sin(4 * math.pi * f * t)) / 1.3)
              return out
          def write(path, notes):
              samples = []
              for f, d in notes:
                  samples += tone(f, d)
              w = wave.open(path, 'wb')
              w.setnchannels(1)
              w.setsampwidth(2)
              w.setframerate(SR)
              w.writeframes(b''.join(struct.pack('<h', int(max(-1.0, min(1.0, x)) * 32767)) for x in samples))
              w.close()
          exts = ['mp3', 'wav', 'ogg', 'm4a']
          def find(name):
              for folder in ['.', 'sounds']:
                  for e in exts:
                      p = '%s/%s.%s' % (folder, name, e)
                      if os.path.exists(p):
                          return p
              return None
          for n in range(1, 6):
              name = 'adhan_%d' % n
              src = find(name)
              if src:
                  shutil.copy(src, '%s/%s.%s' % (raw, name, src.rsplit('.', 1)[1]))
                  print('using your file for', name, src)
              else:
                  write('%s/%s.wav' % (raw, name), [(330 + 40 * n, 0.9), (392 + 40 * n, 0.9), (494 + 40 * n, 1.4)] * 2)
                  print('no file for', name, '- generated a test chime')
          src = find('iqama')
          if src:
              shutil.copy(src, '%s/iqama.%s' % (raw, src.rsplit('.', 1)[1]))
              print('using your file for iqama', src)
          else:
              write(raw + '/iqama.wav', [(659, 0.7), (523, 1.2)] * 2)
              print('no iqama file, generated a test chime')
          open(raw + '/keep.xml', 'w').write('<?xml version="1.0" encoding="utf-8"?>\n<resources xmlns:tools="http://schemas.android.com/tools" tools:keep="@raw/*" />\n')
          print(sorted(os.listdir(raw)))
          PY
      - name: Build APK
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: wird-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
